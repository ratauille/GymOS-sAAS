# dataconnect/connector/queries.gql

# Listar todas las clases programadas con datos del entrenador y gimnasio
query ListClasses @auth(level: PUBLIC) {
  classes {
    id
    name
    description
    capacity
    startTime
    trainer {
      id
      fullName
      email
    }
    gym {
      id
      name
      address
    }
  }
}

# Obtener reservas de un usuario
query GetUserBookings($userId: String!) @auth(level: PUBLIC) {
  bookings(where: { userId: { eq: $userId } }) {
    class {
      id
      name
      startTime
      trainer {
        fullName
      }
    }
    bookedAt
    status
  }
}
