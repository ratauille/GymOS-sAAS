# dataconnect/schema/schema.gql
# Firebase DataConnect Schema para GymOS

# 1. Tabla de Gimnasios (Sede/Sucursal)
type Gym @table {
  id: UUID! @default(expr: "uuidV4()")
  name: String!
  address: String!
  phone: String
}

# 2. Tabla de Usuarios (Clientes / Entrenadores)
type User @table {
  id: String! @primary # UID de Firebase Authentication
  email: String!
  fullName: String!
  role: String! # "client", "trainer", "admin"
  gymId: UUID!
}

# 3. Tabla de Clases / Sesiones de entrenamiento
type Class @table {
  id: UUID! @default(expr: "uuidV4()")
  name: String!
  description: String
  capacity: Int!
  startTime: Timestamp!
  endTime: Timestamp!
  trainerId: String!
  gymId: UUID!
}

# 4. Tabla de Reservas (Muchos a Muchos)
type Booking @table {
  id: UUID! @default(expr: "uuidV4()")
  userId: String!
  classId: UUID!
  bookedAt: Timestamp! @default(expr: "request.time")
  status: String! @default(value: "confirmed")
}
